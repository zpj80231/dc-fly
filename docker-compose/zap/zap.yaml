env:
  contexts:
    - name: baseline
      urls:
        - __TARGET_URL__
      excludePaths: []
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      enableTags: false
      maxAlertsPerRule: 10

  - type: spider
    parameters:
      context: baseline
      url: __TARGET_URL__
      maxDuration: 1

  - type: passiveScan-wait
    parameters:
      maxDuration: 0

  - type: report
    parameters:
      template: __REPORT_TEMPLATE__
      reportDir: __REPORT_DIR__
      reportFile: report.html
      reportTitle: Web 安全检测报告
      reportDescription: 基线扫描结果（爬虫与被动扫描）
